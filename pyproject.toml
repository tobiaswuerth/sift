[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "sift-rag"
dynamic = ["version"]
description = "Fast local search over text and Markdown files, built for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Würth" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "sentence-transformers>=6.1",  # the module layout embeddinggemma-2 is saved in
    "transformers>=5.18",  # the first release with embeddinggemma-2
    "mcp>=2.0",
    "nvidia-ml-py>=12",  # NVML: free GPU memory as nvidia-smi sees it
]
keywords = ["search", "rag", "embeddings", "mcp", "markdown", "bm25", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/tobiaswuerth/sift"
Documentation = "https://github.com/tobiaswuerth/sift#readme"
Issues = "https://github.com/tobiaswuerth/sift/issues"
Changelog = "https://github.com/tobiaswuerth/sift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=4", "build>=1.2", "twine>=6"]

[project.scripts]
sift = "sift.cli:main"
sift-rag = "sift.cli:main"  # so that `uvx sift-rag ...` works: uvx runs the command named like the package

[tool.setuptools]
packages = ["sift"]

[tool.setuptools.dynamic]
version = { attr = "sift.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RUF", "PERF"]
ignore = [
    "B905",  # zip() without strict=
    "SIM905",  # a word list as one split string reads better than a long list literal
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"  # @pytest.mark.parametrize("a, b", ...)

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]  # a warning today is a failure tomorrow

[tool.coverage.run]
source = ["sift"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
