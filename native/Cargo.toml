[package]
name = "sift-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
rayon = "1.12.0"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
as_conversions = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
