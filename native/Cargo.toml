[package]
name = "sift-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
rayon = "1.12.0"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
