name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the same checks first

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    # Tests use small fake models, so they need neither a GPU nor model downloads. Coverage must stay at 100%.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov

  package:
    # Builds the package and checks it as PyPI and users will see it. The release publishes exactly these files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and run both commands
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --no-deps dist/*.whl
          /tmp/clean/bin/sift --version
          /tmp/clean/bin/sift-rag --version
      - name: Check that the dependencies resolve
        run: /tmp/clean/bin/pip install --dry-run --ignore-installed dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
