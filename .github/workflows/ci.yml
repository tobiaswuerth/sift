name: CI

# Every pull request must pass these checks before it can merge, and they run again on each commit the merges make
# on main. The release workflow publishes only a commit of main whose run here passed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # each commit of main keeps its run: it may be a release

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  types:
    # pyright, strictly, over all of sift: as on each system sift runs on, whichever runs this.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
          activate-environment: true  # pyright reads the packages of the `python` on the PATH
          enable-cache: true
      - run: uv pip install --torch-backend cpu -e ".[dev]"
      - run: pyright --pythonplatform Linux
      - run: pyright --pythonplatform Darwin
      - run: pyright --pythonplatform Windows

  first:
    # The oldest and the newest Python, on one system, before the other jobs of the matrix: what fails on a Python,
    # as a warning new in one does, is said by two jobs, not by twenty. Named as the matrix names its jobs.
    # Tests use small fake models, so they need neither a GPU nor model downloads. Coverage must stay at 100%.
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung install fails here instead of after GitHub's 6 hours
    steps: &test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - run: uv pip install --torch-backend cpu -e ".[dev]"
      # In a process per core: a quarter of the time on four. The slowest are named: what a system is slow at shows.
      - run: pytest -q --cov -n auto --durations=15
      - run: python scripts/smoke.py  # every command as a user runs it, each in a process of its own

  test:
    # Every other system and Python, once the hooks, the types and the first two jobs pass.
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    needs: [lint, types, first]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:  # what `first` ran
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps: *test

  lowest:
    # The lowest versions sift names of what it depends on, on the oldest Python: what sift claims to run with.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
      - run: uv pip install --resolution lowest-direct --torch-backend cpu -e ".[dev]"
      - run: pytest -q -n auto

  tests:
    # One check for the whole matrix and the lowest versions: required in place of each job by name, it lets the
    # matrix change.
    if: always()
    needs: [first, test, lowest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the matrix passed, and that of the lowest versions
        env:
          FIRST: ${{ needs.first.result }}
          REST: ${{ needs.test.result }}
          LOWEST: ${{ needs.lowest.result }}
        run: test "$FIRST" = success && test "$REST" = success && test "$LOWEST" = success

  package:
    # Builds the package and checks it as PyPI and users will see it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - run: uv run --no-project scripts/package.py  # as the gate checks it
