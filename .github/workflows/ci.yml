name: CI

# Every job runs a session of the gate (noxfile.py), as `uv run --only-group gate nox` runs it locally.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # each commit of main keeps its run: it may be a release

env:
  NOX: uv run --locked --only-group gate nox

defaults:
  run:
    shell: bash

jobs:
  lint:
    env:
      PYTHON: "3.12"
      SESSION: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &prepare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ env.PYTHON }}
          enable-cache: true
      - run: $NOX -s "$SESSION"

  types:
    env:
      PYTHON: "3.12"
      SESSION: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: *prepare

  first:
    env:
      PYTHON: ${{ matrix.python }}
      SESSION: tests-${{ matrix.python }}
    # The oldest and the newest Python first: what fails on one is said by two jobs, not by sixteen.
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps: *prepare

  test:
    env:
      PYTHON: ${{ matrix.python }}
      SESSION: tests-${{ matrix.python }}
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    needs: [lint, types, first]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        exclude:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps: *prepare

  lowest:
    env:
      PYTHON: "3.12"
      SESSION: lowest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *prepare

  oldest:
    # Python 3.12.0 itself, the first release sift supports: uv's own build of it, never the runner's newer 3.12.
    env:
      PYTHON: "3.12.0"
      SESSION: oldest
      UV_PYTHON_PREFERENCE: only-managed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *prepare

  tests:
    # One required check for the whole matrix, the lowest versions and the first Python, so that the matrix may
    # change.
    if: always()
    needs: [first, test, lowest, oldest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the matrix passed, and those of the lowest versions and the first Python
        env:
          FIRST: ${{ needs.first.result }}
          REST: ${{ needs.test.result }}
          LOWEST: ${{ needs.lowest.result }}
          OLDEST: ${{ needs.oldest.result }}
        run: test "$FIRST" = success && test "$REST" = success && test "$LOWEST" = success && test "$OLDEST" = success

  package:
    env:
      PYTHON: "3.12"
      SESSION: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: *prepare
