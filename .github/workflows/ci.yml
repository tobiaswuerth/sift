name: CI

# Every pull request must pass these checks before it can merge into main. Main isn't tested again: the release
# workflow publishes what the pull request tested, and runs these checks itself only when main's code differs.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    # Tests use small fake models, so they need neither a GPU nor model downloads. Coverage must stay at 100%.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung install fails here instead of after GitHub's 6 hours
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - run: uv pip install --torch-backend cpu -e ".[dev]"
      - run: pytest -q --cov

  package:
    # Builds the package and checks it as PyPI and users will see it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Check that the changelog has a section for the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sift/__init__.py)
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version, the version in sift/__init__.py"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run both commands
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean --no-deps dist/*.whl
          /tmp/clean/bin/sift --version
          /tmp/clean/bin/sift-rag --version
      - name: Check that the dependencies resolve
        run: uv pip install --python /tmp/clean --dry-run dist/*.whl
