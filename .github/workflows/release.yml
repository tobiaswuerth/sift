name: Release

# Runs on every merge into main. When sift/__init__.py names a version without a tag, it publishes that version to
# PyPI and makes a GitHub release, tagging the merge. See "Releasing" in CONTRIBUTING.md.
#
# The pull request already passed every check on this code, so the tests run here only when main's code differs
# from the pull request's last commit (its branch was behind main when it merged).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
      - name: Is this version released yet?
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sift/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is released already: nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Did the pull request test this exact code?
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
          tree=$(git rev-parse "$GITHUB_SHA^{tree}")
          if [ -n "$head" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)" = "$tree" ]; then
            echo "main holds the same code as the pull request's last commit, $head, which passed every check."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "main's code differs from the pull request's last commit (${head:-none found}): testing it first."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check
    if: needs.check.outputs.new == 'true' && needs.check.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    if: ${{ !cancelled() && needs.check.outputs.new == 'true' && contains(fromJSON('["success", "skipped"]'), needs.ci.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sift-rag/
    permissions:
      id-token: write  # trusted publishing: PyPI verifies this workflow, no token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [check, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Tag the merge and make the GitHub release, with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/ { found = index($0, "[" v "]") } found && !/^## \[/ && !/^\[.*\]: /' \
            CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
