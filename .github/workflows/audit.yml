name: Audit

# Once a week, the packages sift installs today, those of the lowest versions it names, and the crates its extension
# is built of are checked against the advisories known for them, and the pins nothing else moves against what
# has been released since. sift names ranges of versions, not versions, so what Dependabot reads in pyproject.toml
# isn't what a user gets, least of all of the packages those bring along. A finding fails this run, which GitHub
# mails; it holds up no pull request. One against a lowest version is fixed by raising it.
on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: dependencies (${{ matrix.resolution }})
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]  # what users get today, and the lowest versions sift allows them
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
      - run: uv pip install --resolution "$RESOLUTION" --torch-backend cpu -e .
        env:
          RESOLUTION: ${{ matrix.resolution }}
      # Without sift itself, which is this checkout; PyTorch's CPU builds under the versions they are builds of,
      # as the advisories name them.
      - run: uv pip freeze --exclude-editable | sed -E 's/\+cpu$//' > installed.txt
      - run: uvx pip-audit@2.10.1 -r installed.txt --no-deps --disable-pip

  crates:
    # What native/Cargo.lock names is what every wheel of sift is built of: nothing a user installs can change it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit --file native/Cargo.lock --deny warnings

  pins:
    # The images Linux's wheels are built in and the rustup fetched into them are pinned in the wheels workflow,
    # where Dependabot reads neither. This asks the registry and rust-lang.org what has been released, and fails
    # with the digest or the checksums to set once a release a week old is newer than the one pinned.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
      - run: python3 -m tools pins
