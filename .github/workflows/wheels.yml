name: Wheels

# The package as PyPI gets it: the sources and a wheel for each platform sift runs on, built from one commit and each
# checked as the gate checks a package (noxfile.py, `package`). CI builds them for every change, so that no release
# builds one for the first time; the release builds them anew from the commit it publishes.
on:
  workflow_call:
    inputs:
      ref:
        description: the commit to build; the caller's own when none is named
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux's wheels are built where glibc is 2.28, in PyPA's images: one built on the runner itself needs the
          # runner's glibc. maturin is told the name the wheel is to bear, and refuses to build one that needs more:
          # asked through `uv build` it checks nothing and names the wheel `linux`, which PyPI refuses. The images
          # bring no Rust, so rustup is fetched for them, held to its checksum. Dependabot reads neither an image of
          # a matrix nor a checksum: the weekly audit says when a release a week old is another than the one pinned
          # here, and what to set (`python -m tools pins`).
          - platform: linux-x86_64
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
            maturin: --compatibility manylinux_2_28
            rustup: x86_64-unknown-linux-gnu
            rustup-sha256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
            maturin: --compatibility manylinux_2_28
            rustup: aarch64-unknown-linux-gnu
            rustup-sha256: 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"  # the oldest macOS the wheel names and its C code is built for; read there alone
      MATURIN_PEP517_ARGS: ${{ matrix.maturin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
          ref: ${{ inputs.ref }}
      - name: Rust, where the image brings none, and git's leave to read a checkout that is the runner's
        if: matrix.rustup
        env:
          RUSTUP: https://static.rust-lang.org/rustup/archive/1.29.3/${{ matrix.rustup }}/rustup-init
          SHA256: ${{ matrix.rustup-sha256 }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --output rustup-init "$RUSTUP"
          echo "$SHA256  rustup-init" | sha256sum --check
          chmod +x rustup-init
          ./rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          rm rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: The toolchain rust-toolchain.toml names
        run: rustup toolchain install
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"  # the uv that builds what PyPI gets, as reviewed: not whichever is newest that day
          python-version: "3.12"
          enable-cache: false  # what PyPI gets is built from the commit alone, nothing an earlier run left
      - run: uv build --build-constraints .github/requirements-build.txt --require-hashes
      # What was built leaves the job here, before the checks below install packages of no fixed version beside it:
      # none of them can change what PyPI gets. A check that fails still stops it, as `dist` needs every build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.platform == 'linux-x86_64'  # the sources are the same wherever they are packed: one copy of them
        with:
          name: sources
          path: dist/*.tar.gz
          if-no-files-found: error
      - run: uvx twine@7.0.0 check --strict dist/*
      - name: Does what PyPI gets hold the tracked sources and nothing else, and do its commands run?
        run: |
          for name in sift sift-rag; do
            said=$(uv tool run --quiet --isolated --torch-backend=cpu --from dist/*.whl "$name" --version)
            uv run --no-project python -m tools package dist "$said"
          done

  dist:
    # One artifact of all that PyPI gets, handed on only when it is whole: the sources and a wheel of every platform,
    # each of a name PyPI takes.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step after it pushes with git
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sources
          path: dist/
      - run: python3 -m tools release files dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
