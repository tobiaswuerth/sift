version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:  # a release a week old: one found malicious is usually pulled within days
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    cooldown:  # a release a week old: one found malicious is usually pulled within days
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo  # the crates of the extension: native/Cargo.toml and its lock
    directory: /native
    cooldown:  # a release a week old: one found malicious is usually pulled within days
      default-days: 7
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip  # the build backend, by hash: .github/requirements-build.txt
    directory: /.github
    cooldown:  # a release a week old: one found malicious is usually pulled within days
      default-days: 7
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    cooldown:  # a release a week old: one found malicious is usually pulled within days
      default-days: 7
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ["*"]
